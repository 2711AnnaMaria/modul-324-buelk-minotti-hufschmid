<div class="editor-header">
  <div class="title-container">
    @if (isEditingTitle) {
      <form class="title-edit-form" (ngSubmit)="saveTitle()">
        <input
          #titleInputRef
          type="text"
          class="title-input"
          [(ngModel)]="tempTierlistName"
          name="tempTierlistName"
          (blur)="saveTitle()"
          (keydown.escape)="cancelEditing()"
          placeholder="Tierlist Name"
        />
        <button type="submit" class="save-icon-btn" title="Speichern" aria-label="Speichern">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </form>
    } @else {
      <button
        type="button"
        class="title-display-wrapper"
        (click)="startEditing()"
        aria-label="Namen bearbeiten"
      >
        <h2 class="title-text">{{ tierlistName }}</h2>
        <span class="edit-icon" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </span>
      </button>
    }
  </div>
</div>

<div class="tier-board-wrapper">
  <div class="tier-board">
    @for (tier of tiers; track tier.id) {
      <div class="tier-row">
        <div class="tier-label" [style.background-color]="tier.color">{{ tier.label }}</div>
        <div class="tier-slot"></div>
      </div>
    }
  </div>
  <button
    type="button"
    class="round-plus-btn add-tier-btn"
    (click)="openAddTierModal()"
    aria-label="Neuen Rang hinzufügen"
  >
    +
  </button>
</div>

<div class="items-row">
  <button type="button" class="add-item-btn-group" aria-label="Neues Objekt hinzufügen">
    <span class="round-plus-btn add-item-btn">+</span>
    <span class="add-item-label">Objekt hinzufügen</span>
  </button>
</div>

@if (isTierModalOpen) {
  <div
    class="modal-backdrop"
    role="button"
    tabindex="-1"
    (click)="closeTierModal()"
    (window:keydown.escape)="closeTierModal()"
  >
    <div
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tier-modal-title"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
      (keydown.escape)="closeTierModal()"
    >
      <h2 id="tier-modal-title" class="modal-title">Neuer Rang</h2>
      <form (ngSubmit)="createTier()">
        <input
          #tierNameInputRef
          type="text"
          class="modal-input"
          placeholder="Name des Rangs eingeben..."
          aria-label="Name des Rangs"
          [(ngModel)]="newTierName"
          name="newTierName"
          required
        />
        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="closeTierModal()">Abbrechen</button>
          <button type="submit" class="btn-create" [disabled]="!newTierName.trim()">
            Erstellen
          </button>
        </div>
      </form>
    </div>
  </div>
}
