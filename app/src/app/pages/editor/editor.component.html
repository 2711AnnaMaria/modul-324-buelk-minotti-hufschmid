<div class="editor-header">
  <div class="title-container">

    @if (isEditingTitle) {
      <form class="title-edit-form" (ngSubmit)="saveTitle()">
        <input
          #titleInputRef
          type="text"
          class="title-input"
          [(ngModel)]="tempTierlistName"
          name="tempTierlistName"
          (blur)="saveTitle()"
          (keydown.escape)="cancelEditing()"
          placeholder="Tierlist Name"
        />
        <button type="submit" class="save-icon-btn" title="Speichern" aria-label="Speichern">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </form>
    } @else {
      <div class="title-display-wrapper" (click)="startEditing()">
        <h2 class="title-text">{{ tierlistName }}</h2>
        <button type="button" class="edit-icon-btn" title="Namen bearbeiten" aria-label="Namen bearbeiten">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </button>
      </div>
    }
  </div>
</div>
